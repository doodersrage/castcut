# Castcut in Docker.
#
#   cd docker
#   cp .env.example .env      # optional: only to change the defaults
#   docker compose up -d --build
#
# Open http://<this machine>:47832. Everything you make (Cast, Gallery, settings, kept renders)
# lives in the castcut_data volume and survives rebuilds; see docs/configuration.md#docker for
# moving an existing install in. Optional extras: `--profile llm` (the LLM: llama.cpp with the
# NSFWVision Qwen3-VL model on an NVIDIA GPU; set LLM_API_BASE_URL=http://llm:8080/v1 in .env),
# `--profile ollama` and `--profile comfyui` (a ComfyUI container) — most setups point at ones
# already running instead. (Outside Docker, Settings → LLM → Built-in LLM installs the same thing.)
services:
  castcut:
    build: ..
    image: castcut:local
    # Optional: with no .env, sign-in is on and the admin is made on the first visit.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 47832
      PROMPT_AUTH_ENABLED: ${PROMPT_AUTH_ENABLED:-true}
      PROMPT_DATA_DIR: /data
      # The address the port is published on (below). The app's startup check reads it: on a
      # network address it refuses to start with sign-in off.
      PROMPT_BIND_HOST: ${CASTCUT_BIND:-0.0.0.0}
    ports:
      - '${CASTCUT_BIND:-0.0.0.0}:${CASTCUT_PORT:-47832}:47832'
    volumes:
      - castcut_data:/data
    extra_hosts:
      # Lets COMFYUI_API_URL / LLM_API_BASE_URL say host.docker.internal on Linux too.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # The LLM Castcut's built-in one runs (Settings → LLM), as a container: the image is Alpine and
  # can't run llama.cpp itself. First start downloads the model (~6 GB) into llm_models.
  # (Rolling tag: llama.cpp publishes no per-build server-cuda tag for current builds.)
  llm:
    profiles: ['llm']
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -hf
      - GitMylo/nsfwvision-qwen3-vl-8b-v3-gguf:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - -c
      - '8192'
      - -ngl
      - '99'
      - --jinja
      - --alias
      - castcut-local
    volumes:
      - llm_models:/root/.cache/llama.cpp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama:
    profiles: ['ollama']
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  comfyui:
    profiles: ['comfyui']
    image: ghcr.io/ai-dock/comfyui:latest
    ports:
      - '127.0.0.1:8188:8188'
    environment:
      COMFY_PROMPT_API_URL: http://castcut:47832
      PROMPT_API_TOKEN: ${PROMPT_API_TOKEN:-}
    restart: unless-stopped

volumes:
  castcut_data:
  llm_models:
  ollama_data:
