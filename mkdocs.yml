site_name: Castcut
site_description: Documentation for Castcut — prompts, ComfyUI, Gallery, and the Play film loop
site_url: https://doodersrage.github.io/castcut/
repo_url: https://github.com/doodersrage/castcut
repo_name: doodersrage/castcut
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Robert McDowell · MIT

docs_dir: docs
site_dir: site

# Old release notes: kept on the site but not in the nav (see docs/archive/README.md).
not_in_nav: |
  archive/

# Broken links and anchors fail the docs build (`mkdocs build --strict` in CI).
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  logo: assets/brand-mark.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/extra.js

nav:
  - Home: README.md
  - Get started:
      - Install: install.md
      - Your first film: first-film.md
      - Models: models.md
  - Guides:
      - Cast: guide-cast.md
      - Outfit: guide-outfit.md
      - Day: guide-day.md
      - Story: guide-story.md
      - Cut a film: guide-film.md
      - Finishing tools: finishing-tools.md
      - On your phone: phone.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Limitations: limitations.md
      - Quick reference: quick-reference.md
  - Reference:
      - Play in depth: play-guide.md
      - Features in depth: features.md
      - Operator guide: operator.md
      - Configuration: configuration.md
      - Desktop app: desktop.md
      - Castcut nodes: castcut-nodes.md
      - Workflow takeover: workflow-takeover.md
      - HTTP API: http-api.md
      - Prompt limits: prompt-limits.md
      - Prompt examples: prompt-examples.md
      - Pose report card: pose-report-card.md
      - Data catalogs: data-catalogs.md
      - Pose reference credits: pose-reference-credits.md
  - Contributors:
      - Architecture: architecture.md
      - Releases: releasing.md
      - Plugin iframe host: plugin-iframe-host.md
      - Performance & scripts: performance/guide.md
  - External:
      - Main README (GitHub): https://github.com/doodersrage/castcut/blob/main/README.md
      - Prompt Studio (classic tools): https://github.com/doodersrage/prompt-studio
      - Diffusers engine: https://github.com/doodersrage/castcut-diffusers

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/doodersrage/castcut
  generator: false
