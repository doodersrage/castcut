<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Castcut</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0c10;
        color: #ececef;
        font-family:
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      p {
        margin: 0.4rem 0 0;
        color: #9aa0ae;
        font-size: 0.9rem;
        max-width: 36rem;
        line-height: 1.45;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Castcut</h1>
        <p id="status">Starting the local server…</p>
      </div>
    </main>
  </body>
</html>
