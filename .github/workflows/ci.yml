name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size

  # The classic Prompt Studio app (apps/prompt-studio): Castcut's shared code without Play. Its
  # type-check catches shared code leaning on Play's declaration-merged fields.
  classic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:classic
      # The core package the standalone Prompt Studio repo installs (fails if it reaches Play).
      - run: npm run pack:core

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Gallery reliability specs first for clearer CI signal on exact-replay regressions.
      - run: npm run test:e2e:gallery
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Play campaign loop is the flagship product bet — fail fast on regressions.
      - run: npm run test:e2e:play
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Auth / Heal / workflow-editor / dogfood metrics — fail fast before full suite.
      - run: npm run test:e2e:ops
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      - run: npm run test:e2e
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Prompt Studio's own pages (src/studio-app, @classic tests) against the classic app.
      - run: npm run test:e2e:classic
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Page snapshots + error context for whichever step failed — CI logs alone only show the assertion.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
