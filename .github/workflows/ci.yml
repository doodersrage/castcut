name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # onnxruntime-node's postinstall downloads its CUDA binaries from nuget, which timed out
      # or reset three pushes running (2026-11-05); CI never runs CUDA.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size

  # The core package the Prompt Studio repo installs: packing fails if shared code reaches Play,
  # and its stand-alone type-check catches shared code leaning on Play's declaration-merged fields.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # onnxruntime-node's postinstall downloads its CUDA binaries from nuget, which timed out
      # or reset three pushes running (2026-11-05); CI never runs CUDA.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run check:core

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # onnxruntime-node's postinstall downloads its CUDA binaries from nuget, which timed out
      # or reset three pushes running (2026-11-05); CI never runs CUDA.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npx playwright install --with-deps chromium
      # Gallery reliability specs first for clearer CI signal on exact-replay regressions.
      - run: npm run test:e2e:gallery
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Play campaign loop is the flagship product bet — fail fast on regressions.
      - run: npm run test:e2e:play
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Auth / Heal / workflow-editor / dogfood metrics — fail fast before full suite.
      - run: npm run test:e2e:ops
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      - run: npm run test:e2e
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Page snapshots + error context for whichever step failed — CI logs alone only show the assertion.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
