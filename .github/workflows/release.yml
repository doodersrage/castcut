name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (from package.json)
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Compute the next version without tagging or publishing
        type: boolean
        default: false
      existing_tag:
        description: Republish an already-cut tag (skip version bump). Example v1.1.0
        type: string
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Main only
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Cut releases from main (Actions → Release → Run workflow on the main branch)."
          exit 1

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      dry_run: ${{ steps.ver.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size

      - name: Cut version on main
        id: cut
        if: github.event_name == 'workflow_dispatch' && inputs.existing_tag == ''
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${VERSION}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — not committing or tagging."
            git checkout -- package.json package-lock.json
            exit 0
          fi
          node scripts/update-changelog.mjs "$VERSION"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXISTING="${{ inputs.existing_tag }}"
            if [ -n "$EXISTING" ]; then
              TAG="${EXISTING#v}"
              echo "version=${TAG}" >> "$GITHUB_OUTPUT"
              echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "version=${{ steps.cut.outputs.version }}" >> "$GITHUB_OUTPUT"
              echo "tag=v${{ steps.cut.outputs.version }}" >> "$GITHUB_OUTPUT"
              echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.ver.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          cat > /tmp/release-preamble.md <<EOF
          ## Castcut ${TAG}

          **Docker (GHCR):**

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          docker run -d --name castcut -p 127.0.0.1:47832:47832 \\
            ${IMAGE}:${VERSION}
          \`\`\`

          Desktop installers (\`.dmg\`, \`.exe\`, \`.deb\`, \`.AppImage\`) attach after the desktop job finishes.

          \`latest\` tracks this tag after a successful image publish. Configuration: [docs/configuration.md](https://github.com/${{ github.repository }}/blob/main/docs/configuration.md). Desktop: [docs/desktop.md](https://github.com/${{ github.repository }}/blob/main/docs/desktop.md). Cutting releases: [docs/releasing.md](https://github.com/${{ github.repository }}/blob/main/docs/releasing.md).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — leaving notes unchanged."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
              --title "Castcut ${TAG}" \
              --notes-file /tmp/release-preamble.md \
              --generate-notes; then
              exit 0
            fi
            echo "gh release create failed (attempt ${attempt}); retrying…"
            sleep $((attempt * 4))
          done
          echo "gh release create failed after retries."
          exit 1

  docker:
    name: Publish container image
    needs: release
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN != '' && github.repository_owner || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names
        id: images
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ "${{ steps.hub.outcome }}" = "success" ]; then
              echo "doodersrage/castcut"
            fi
          } > /tmp/docker-images.txt
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/docker-images.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Castcut
            org.opencontainers.image.description=Local character films with ComfyUI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}

      - uses: docker/build-push-action@v6
        id: push
        continue-on-error: true
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GHCR write_package hint
        if: steps.push.outcome == 'failure'
        run: |
          echo "::error::GHCR denied the image push (usually permission_denied: write_package). Open https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/castcut/settings → Manage Actions access → add ${GITHUB_REPOSITORY} with Write. Or set repo secret GHCR_TOKEN to a classic PAT with write:packages. GitHub Release assets can still succeed."
          exit 1

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: release
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            bundles: dmg
          - os: ubuntu-22.04
            label: Linux
            bundles: deb,appimage
          - os: windows-latest
            label: Windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 squashfs-tools file

      - run: npm ci
      - name: Next.js standalone (desktop flags)
        run: npm run build
        env:
          NEXT_PUBLIC_PROMPT_DESKTOP: 'true'
          NEXT_PUBLIC_PROMPT_NSFW_GENERATOR_ENABLED: 'true'
          PROMPT_NSFW_GENERATOR_ENABLED: 'true'
      - run: npm --prefix desktop ci
      - run: npm run desktop:icons
      - name: Official icns/ico
        working-directory: desktop
        run: npx tauri icon ../public/icon.svg -o src-tauri/icons
      - run: npm run desktop:stage
      - run: npm run desktop:node

      - name: Tauri build (.deb)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx tauri build --bundles deb

      - name: Attach Linux .deb
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .deb produced."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Tauri build (AppImage)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          # linuxdeploy strip dies on .relr.dyn; AppImage tooling needs ARCH + extract-and-run on CI.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
        run: |
          set -euxo pipefail
          npx tauri build --bundles appimage --verbose
          # Drop Ubuntu-bundled libwayland* so host Mesa/EGL match (DMA-BUF stays on).
          bash scripts/unbundle-appimage-wayland.sh

      - name: Attach Linux AppImage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No AppImage produced."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Tauri build
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Attach installers
        if: runner.os != 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No desktop installers found."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
